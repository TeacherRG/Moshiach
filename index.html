<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>12-й принцип веры — Верю полной верой в приход Мошиаха</title>
<link href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@300;400;700;900&family=Noto+Serif+Hebrew:wght@300;400;700&family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/styles.css">
</head>
<body>

<!-- BACKGROUND -->
<div class="stars" id="stars"></div>
<div class="desert-bg"></div>

<!-- MENU -->
<div class="top-menu">
  <button class="menu-toggle-btn" id="menuToggleBtn" type="button" aria-label="Открыть меню">
    <span></span><span></span><span></span>
  </button>
  <div class="top-menu-panel" id="topMenuPanel">
    <button class="menu-about-btn" id="menuAboutBtn" type="button" onclick="showAboutModal()"></button>
    <div class="menu-chapters-list" id="menuChaptersList"></div>
    <div class="menu-lang-row">
      <button class="menu-language-btn" id="langRuBtn" type="button" onclick="setLanguage('ru')"></button>
      <button class="menu-language-btn" id="langDeBtn" type="button" onclick="setLanguage('de')"></button>
    </div>
  </div>
</div>

<!-- AUDIO -->
<div class="audio-bar">
  <button class="audio-btn" id="audioBtn" onclick="AudioQuest.toggle()">
    <span class="a-icon">▶</span><span class="a-label">Слушать</span>
  </button>
</div>

<!-- TOOLTIP -->
<div class="tooltip-bubble" id="tooltipBubble" role="tooltip" aria-hidden="true">
  <div class="tooltip-arrow" id="tooltipArrow"></div>
</div>

<!-- APP -->
<div id="app">
  <div class="card" id="mainCard">
    <div id="screenContent"></div>
  </div>
</div>

<!-- ABOUT MODAL -->
<div class="about-modal" id="aboutModal" onclick="closeAboutModal()">
  <div class="about-modal-box" onclick="event.stopPropagation()">
    <button class="about-modal-close" type="button" onclick="closeAboutModal()">✕</button>
    <div class="about-modal-title" id="aboutModalTitle"></div>
    <div class="about-modal-text" id="aboutModalText"></div>
  </div>
</div>

<script src="assets/js/content.js"></script>
<script src="assets/js/audio.js"></script>
<script src="assets/js/app.js"></script>
</body>
</html>
